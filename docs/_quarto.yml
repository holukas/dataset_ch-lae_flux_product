project:
  type: website
  # Mirrors the old Jupyter Book output path so the ghp-import publish flow and
  # .gitignore (docs/_build/) stay unchanged.
  output-dir: _build/html

# Show a "last updated" date on every page. `date-modified` renders under a
# "Modified" label (vs "Published" for `date`), which reads correctly as
# last-updated. Applied project-wide so it inherits into every page. Uses the
# file's filesystem modification time (Quarto built-in), not the git commit date.
date-modified: last-modified
# Render dates as e.g. "15 July 2026" (day, full month name, year). Tokens are
# Quarto's date-format tokens, not strftime. Applies to the "Modified" date the
# _last-modified-sidebar.html partial reads and shows in the right sidebar.
date-format: "D MMMM YYYY"

website:
  title: "CH-LAE Flux Product"
  # Multi-resolution .ico (16/24/32/48/64/128/256): browsers pick the frame that
  # fits, and each frame is drawn at its own size rather than downscaled from one
  # bitmap, so the 16 px tab icon stays legible. favicon.svg and favicon.png (512)
  # sit alongside for reuse (social cards, apple-touch) but Quarto emits only one
  # icon link, so they are not referenced here.
  favicon: favicon.ico
  search: true
  # Prev/next links at the bottom of each page, and a "back to top" control.
  page-navigation: true
  back-to-top-navigation: true
  repo-url: https://github.com/holukas/dataset_ch-lae_flux_product
  repo-actions: [source, issue]
  # Author lives ONLY here in the footer, never as page `author` metadata (which
  # would render it in each page's title block at the top).
  page-footer: "Lukas Hörtnagl · [Grassland Sciences group, ETH Zurich](https://gl.ethz.ch/) · © 2025"
  # A website sidebar (unlike a book) is collapsible — it renders a collapse
  # toggle so the left sidebar can be hidden.
  sidebar:
    style: floating
    collapse-level: 1
    # No Quarto `logo:` here. The sidebar brand (the site mark beside a one-line
    # wordmark) is drawn by _logo-sidebar.html, which replaces the text of the
    # sidebar title link with an inline copy of logo.svg.
    #
    # The PDF of the whole documentation, an icon beside the sidebar title.
    # The file is rendered with the pdf profile (_quarto-pdf.yml) and copied
    # into the site root by deploy.ps1; a plain `quarto render docs` does not
    # make it, so the link is dead in a local preview without that step.
    tools:
      - icon: file-earmark-pdf
        href: CH-LAE_flux_product_docs.pdf
        text: "Download the documentation as PDF"
    #
    # Pages are grouped by what a reader comes for, not in processing order:
    # first what a data user needs (columns, flags, known issues, versions),
    # then the meteo products, the dashboards, the processing methods, the site,
    # and background material. The methods pages are labelled by what they do,
    # with the level code second ("Outlier removal (L3.2)"), so a newcomer does
    # not need the level scheme to find a step. The PDF profile
    # (_quarto-pdf.yml) repeats this order in book.chapters.
    contents:
      - text: "Start here"
        href: index.md
      - section: "Using the data"
        contents:
          - Overview.md
          - Variables.md
          - text: "Quality flag (QCF)"
            href: QCF.md
          - Issues.md
          # One page per release under the versions page, plus one table of
          # their differences. The comparisons of the LI-7500 years evaluate
          # FP2026.2, so they sit under that release rather than under a
          # processing level.
          - section: Dataset_Versions.md
            contents:
              - Version_Differences.md
              - text: "FP2026.1 (current)"
                href: Version_FP2026.1.md
              - section: "FP2026.2 (in progress)"
                href: Version_FP2026.2.md
                contents:
                  - text: "Comparisons of the LI-7500 years"
                    href: IRGA75_Comparisons.md
      - section: "Meteo"
        contents:
          # The per-variable detail pages are nested under Meteo_Data.md rather
          # than listed beside it, so the sidebar collapses them: there are more
          # than a dozen and they would otherwise crowd out every other page. A
          # `section:` that names a file keeps Meteo_Data.md itself a link rather
          # than turning it into a bare heading. Listed in the same order as the
          # parameter table at the top of Meteo_Data.md.
          - section: Meteo_Data.md
            contents:
              - Meteo_Data_SW_IN.md
              - Meteo_Data_TA.md
              - Meteo_Data_PPFD_IN.md
              - Meteo_Data_RH.md
              - Meteo_Data_PA.md
              - Meteo_Data_LW_IN.md
              - Meteo_Data_VPD.md
              - Meteo_Data_PREC.md
              - Meteo_Data_SWC.md
              - Meteo_Data_TS.md
              - Meteo_Data_G.md
              - Meteo_Data_SW_OUT.md
              - Meteo_Data_LW_OUT.md
      # Not inside "Meteo": a dashboard covers one exported series, and the flux
      # products will add their own. Each dashboard is a standalone HTML file
      # built into the render output by deploy.ps1, not a Quarto page, so the
      # entry points at a page that links them rather than at the files.
      - Data_Dashboards.md
      - section: "Flux processing methods"
        contents:
          - text: "Raw data"
            href: Raw_Data.md
          - text: "Preliminary flux calculation (L0)"
            href: L0.md
          - text: "Flux calculation (L1)"
            href: L1.md
          - text: "EddyPro settings (L1)"
            href: L1_EddyPro_Settings.md
          - text: "Open-path CO2 flux correction (L1.1)"
            href: L1.1.md
          # A `section:` with an `href:`: FPC.qmd stays a link, under a label of
          # its own, and holds the post-processing levels.
          - section: "Post-processing chain"
            href: FPC.qmd
            contents:
              - text: "Quality flag expansion (L2)"
                href: L2.md
              - text: "Storage correction (L3.1)"
                href: L3.1.md
              - text: "Outlier removal (L3.2)"
                href: L3.2.md
              - text: "USTAR filtering (L3.3)"
                href: L3.3.md
              - text: "Gap-filling (L4.1)"
                href: L4.1.md
              - text: "NEE partitioning (L4.2)"
                href: L4.2.md
      - section: "Site and instruments"
        contents:
          - Site_Info.md
          - Instrumentation.md
          - Yearly_Notes.md
      # Supplementary.md is an empty stub and is left out of the nav until it
      # has content.
      - section: "Background"
        contents:
          # .qmd, not .md: the page carries an executable ```{mermaid} cell.
          - Meteo_Product_Chain.qmd
          - Software.md
          - Links.md
          - References.md
      # Links to the notebook index built by build_notebooks.py, which lands at
      # notebooks/index.html when `quarto render docs` renders the staged copies.
      - text: Notebooks
        href: notebooks/index.html
      - text: Repository
        href: https://github.com/holukas/dataset_ch-lae_flux_product

bibliography: references.bib

format:
  html:
    # Light/dark theme pair — readers get a toggle in the navbar.
    theme:
      light: cosmo
      dark: darkly
    # Wide-table handling + minor tweaks (see styles.css).
    css: styles.css
    toc: true
    # Level 4 so the per-plot and per-table headings of the notebooks
    # ("📊 Plot:", "📋 Table:") appear in the "On this page" sidebar.
    toc-depth: 4
    # Click any image to open it enlarged in a lightbox overlay.
    lightbox: auto
    # Relocate the "Modified" date and the light/dark toggle into the right
    # ("On this page") sidebar (both are client-side JS tweaks).
    include-after-body:
      - _last-modified-sidebar.html
      - _theme-toggle.html
      # Make the Mermaid flowcharts pannable and zoomable. `lightbox: auto`
      # above cannot help there, because it works on <img> elements and Quarto
      # renders a mermaid cell to an inline <svg>.
      - _mermaid-zoom.html
      # Draw the sidebar brand (site mark and wordmark) in place of the plain
      # title text.
      - _logo-sidebar.html
