[project]
name = "dataset-ch-lae-flux-product"
version = "0.1.0"
description = "Dataset for mixed forest CH-LAE"
authors = [
    {name = "Lukas Hörtnagl", email = "lukas.hoertnagl@usys.ethz.ch"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # [db] pulls in influxdb-client, which diive's InfluxIO needs to reach the
    # database (workflow/10_METEO notebook 01). diive also exposes this as its
    # own 'db' dependency group, but groups are not transitive — only the extra
    # is reachable from here.
    "diive[db]",
    # Theil-Sen slopes and Kendall's tau, used by the trend figures in
    # 10_METEO/30_PRODUCTS/02 and 90_DATASET_OVERVIEW. It arrives transitively
    # through diive, but a notebook here imports it directly, so it is declared.
    "scipy>=1.11",
]

[dependency-groups]
dev = [
    "ghp-import>=2.1.0,<3.0.0",
    "jupyterlab>=4.5.7",
    "quarto-cli>=1.5",
]

[tool.uv]
package = false

[tool.uv.sources]
diive = { path = "../../diive", editable = true }
